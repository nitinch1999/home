<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Ji Apartment \u2014 Maintenance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050b18;
    --bg-mid:#081226;
    --panel:#0c1830;
    --panel-2:#0a1428;
    --line:rgba(0,217,255,0.16);
    --line-soft:rgba(255,255,255,0.06);
    --ink:#e7f1ff;
    --ink-soft:#7d90b8;
    --neon:#00d9ff;
    --neon-2:#2979ff;
    --neon-glow:rgba(0,217,255,0.35);
    --gold:#f0d9ae;
    --amber:#ffb84d;
    --amber-bg:rgba(255,184,77,0.12);
    --green:#00ffab;
    --green-bg:rgba(0,255,171,0.1);
    --red:#ff5577;
    --red-bg:rgba(255,85,119,0.12);
    --radius:14px;
    --shadow: 0 10px 30px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,217,255,0.06), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1000px 600px at 8% -10%, rgba(41,121,255,0.18), transparent 60%),
      radial-gradient(900px 700px at 105% 15%, rgba(0,217,255,0.14), transparent 55%),
      radial-gradient(1200px 900px at 50% 120%, rgba(123,97,255,0.10), transparent 60%),
      var(--bg-deep);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:1180px;margin:0 auto;padding-bottom:60px;}

  /* HEADER */
  .topbar{
    background:linear-gradient(180deg, rgba(8,15,32,0.92), rgba(8,15,32,0.75));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:#fff;
    padding:16px 20px 0 20px;
    position:sticky; top:0; z-index:40;
    border-bottom:1px solid rgba(0,217,255,0.22);
    box-shadow:0 4px 30px rgba(0,217,255,0.08), 0 6px 24px rgba(0,0,0,0.4);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:1180px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo-tile{
    width:52px;height:52px;border-radius:12px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden; flex-shrink:0;
    box-shadow:0 0 0 2px rgba(240,217,174,0.5), 0 0 18px rgba(0,217,255,0.35), 0 6px 16px rgba(0,0,0,0.5);
    border:2px solid var(--gold);
  }
  .logo-tile img{width:100%; height:100%; object-fit:cover; object-position:center 15%;}
  .brand-text h1{
    font-size:21.6px; margin:0; letter-spacing:0.2px; font-weight:700;
    background:linear-gradient(90deg, #ffffff 20%, var(--neon) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 22px rgba(0,217,255,0.25);
  }
  .refresh-block{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .btn-refresh{
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:8px 16px;
    border-radius:10px; border:1px solid rgba(0,217,255,0.4); background:rgba(0,217,255,0.08); color:var(--neon);
    cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap;
    transition:background .15s, opacity .15s, box-shadow .15s;
    box-shadow:0 0 14px rgba(0,217,255,0.12);
  }
  .btn-refresh:hover{background:rgba(0,217,255,0.16); box-shadow:0 0 20px rgba(0,217,255,0.3);}
  .btn-refresh:disabled{opacity:0.6; cursor:not-allowed;}
  .btn-refresh svg{width:13px; height:13px; flex-shrink:0;}
  .btn-refresh.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .last-refresh{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); white-space:nowrap;}
  .last-refresh.err{color:var(--red);}
  .nav{display:flex; gap:4px; margin-top:14px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    background:none;border:none;color:var(--ink-soft);
    padding:10px 14px; font-size:13.5px; font-family:'Inter',sans-serif; font-weight:600;
    cursor:pointer; border-bottom:2.5px solid transparent; white-space:nowrap;
    transition:color .15s, border-color .15s, text-shadow .15s;
  }
  .nav button:hover{color:#fff;}
  .nav button.active{color:var(--neon); border-color:var(--neon); text-shadow:0 0 14px rgba(0,217,255,0.6);}

  .content{padding:22px 20px 0 20px;}
  .month-strip{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px;
    margin-bottom:18px;
  }
  .month-strip h2{font-size:22px; margin:0; color:#fff;}
  .month-strip .tag{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--neon);
    background:rgba(0,217,255,0.08); border:1px solid rgba(0,217,255,0.25); padding:4px 10px; border-radius:20px;
  }

  /* CARDS - 3D glass panels */
  .card{
    background:linear-gradient(155deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  @media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{padding:16px; cursor:default; position:relative; overflow:hidden;}
  .stat::before{
    content:''; position:absolute; top:-40%; right:-30%; width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,217,255,0.12), transparent 70%); pointer-events:none;
  }
  .stat.clickable{cursor:pointer;}
  .stat.clickable:hover{transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,217,255,0.25), 0 0 30px rgba(0,217,255,0.18);}
  .stat .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:700; margin-top:6px; color:var(--neon); text-shadow:0 0 16px rgba(0,217,255,0.45);}
  .stat .value.amber{color:var(--amber); text-shadow:0 0 16px rgba(255,184,77,0.45);}
  .stat .value.green{color:var(--green); text-shadow:0 0 16px rgba(0,255,171,0.4);}
  .stat .value.red{color:var(--red); text-shadow:0 0 16px rgba(255,85,119,0.4);}
  .stat .foot{font-size:11px; color:var(--ink-soft); margin-top:4px; position:relative;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px 0; flex-wrap:wrap; gap:8px;}
  .section-title h3{font-size:16px; margin:0; color:#fff;}
  .section-title .hint{font-size:12px; color:var(--ink-soft);}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}

  .list-card{padding:14px;}
  .list-row{display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line-soft); font-size:13.5px; gap:8px; color:var(--ink);}
  .list-row:last-child{border-bottom:none;}
  .badge{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    font-family:'IBM Plex Mono',monospace; white-space:nowrap; border:1px solid transparent;
  }
  .badge.paid{background:var(--green-bg); color:var(--green); border-color:rgba(0,255,171,0.35); box-shadow:0 0 10px rgba(0,255,171,0.15);}
  .badge.late{background:var(--amber-bg); color:var(--amber); border-color:rgba(255,184,77,0.35); box-shadow:0 0 10px rgba(255,184,77,0.15);}
  .badge.pending{background:var(--red-bg); color:var(--red); border-color:rgba(255,85,119,0.35); box-shadow:0 0 10px rgba(255,85,119,0.15);}
  .badge.vacant{background:rgba(255,255,255,0.06); color:var(--ink-soft); border-color:rgba(255,255,255,0.12);}

  /* FLATS GRID */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  input[type=text], input[type=number], input[type=date], input[type=tel], input[type=url], select, textarea{
    font-family:'Inter',sans-serif; font-size:13.5px; padding:9px 11px; border:1px solid var(--line);
    border-radius:8px; background:var(--panel-2); color:var(--ink); outline:none; width:100%;
  }
  input::placeholder{color:var(--ink-soft);}
  input:focus, select:focus, textarea:focus{border-color:var(--neon); box-shadow:0 0 0 3px rgba(0,217,255,0.15);}
  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; padding:10px 18px;
    border-radius:10px; border:none; background:linear-gradient(135deg, var(--neon-2), var(--neon)); color:#04101f;
    cursor:pointer; transition:transform .12s, box-shadow .12s, opacity .12s; white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,150,255,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 8px 22px rgba(0,180,255,0.5), inset 0 1px 0 rgba(255,255,255,0.4);}
  .btn:active{transform:translateY(1px); box-shadow:0 2px 8px rgba(0,150,255,0.35);}
  .btn:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
  .btn.ghost{background:transparent; color:var(--neon); border:1px solid rgba(0,217,255,0.35); box-shadow:none;}
  .btn.ghost:hover{background:rgba(0,217,255,0.1); box-shadow:0 0 16px rgba(0,217,255,0.2);}
  .btn.danger{background:linear-gradient(135deg, #ff5577, #ff2e55); box-shadow:0 4px 16px rgba(255,60,90,0.35), inset 0 1px 0 rgba(255,255,255,0.25);}
  .btn.small{padding:7px 12px; font-size:12px;}
  .btn.amber{background:linear-gradient(135deg, #ffb84d, #ff9d2e);}

  .flats-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media(max-width:900px){.flats-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.flats-grid{grid-template-columns:1fr;}}
  .flat-card{padding:14px; cursor:pointer;}
  .flat-card:hover{transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,217,255,0.25), 0 0 30px rgba(0,217,255,0.15);}
  .flat-card .fnum{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#fff;}
  .flat-card .owner{font-size:12.5px; color:var(--ink-soft); margin:2px 0 10px 0;}
  .flat-card .amt{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--neon); margin-top:8px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line-soft); color:var(--ink);}
  th{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(0,217,255,0.03);}
  .amt-cell{font-family:'IBM Plex Mono',monospace; color:var(--neon);}
  .table-wrap{overflow-x:auto;}

  /* MODAL */
  .overlay{
    position:fixed; inset:0; background:rgba(2,6,16,0.75); backdrop-filter:blur(4px); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;
  }
  .modal{
    background:linear-gradient(155deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:16px; max-width:640px; width:100%; padding:0;
    box-shadow:0 30px 80px rgba(0,0,0,0.7), 0 0 40px rgba(0,217,255,0.12);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; padding:18px 22px;
    border-bottom:1px solid var(--line); background:rgba(0,217,255,0.04);
    border-radius:16px 16px 0 0; position:sticky; top:0;
  }
  .modal-head h3{margin:0; font-size:16px; color:#fff;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .modal-close:hover{color:var(--neon);}
  .modal-body{padding:20px 22px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .form-field{display:flex; flex-direction:column; gap:5px;}
  .form-field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .form-field.full{grid-column:1/-1;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;}

  /* Report tabs */
  .rep-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .rep-tabs button{
    padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2);
    font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .rep-tabs button.active{background:linear-gradient(135deg, var(--neon-2), var(--neon)); color:#04101f; border-color:transparent; box-shadow:0 0 16px rgba(0,217,255,0.35);}

  .loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--neon); font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center; padding:20px; background:var(--bg-deep);}

  footer.note{font-size:11.5px; color:var(--ink-soft); text-align:center; padding:26px 20px 10px 20px;}

  /* SETUP GATE */
  .gate-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{max-width:560px; width:100%; background:linear-gradient(155deg, var(--panel), var(--panel-2)); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:30px;}
  .gate-card .logo-tile{width:64px;height:64px; margin-bottom:14px;}
  .gate-card h2{margin:0 0 6px 0; font-size:20px; color:#fff;}
  .gate-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .gate-steps{font-size:13px; color:var(--ink); line-height:1.8; padding-left:18px; margin:14px 0;}
  .gate-error{background:var(--red-bg); color:var(--red); font-size:12.5px; padding:8px 12px; border-radius:8px; margin-top:10px; border:1px solid rgba(255,85,119,0.3);}

  .date-field{position:relative; display:flex; align-items:center;}
  .date-field .date-text{padding-right:36px; width:100%;}
  .date-field .date-icon{position:absolute; right:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-soft); pointer-events:none;}
  .date-field .date-native{
    position:absolute; right:0; top:0; width:32px; height:100%;
    opacity:0; cursor:pointer; border:none; padding:0; margin:0; background:transparent;
  }

  .chart-card{padding:18px;}
  .chart-wrap{position:relative; width:100%;}
  @media(max-width:600px){
    .chart-card{padding:12px;}
  }
  @media print{
    .topbar, .toolbar, .btn, .nav{display:none !important;}
    body{background:#fff; color:#000;}
    .card{box-shadow:none; border:1px solid #999; background:#fff;}
  }

</style>
</head>

<div id="app"><div class="loading-screen">Loading.....</div></div>

  return datePart + ', ' + timePart;
}

/* ============================= LOCAL SETTING (backend URL only) ============================= */
async function getBackendUrl(){
  try{
    return localStorage.getItem('backendUrl');
  }catch(e){ return null; }
}
async function setBackendUrl(url){
  try{ localStorage.setItem('backendUrl', url); }catch(e){ /* storage blocked, keep in-memory only */ }
  BACKEND_URL = url;
}

/* ============================= API LAYER (Google Sheets via Apps Script) ============================= */
async function apiGetData(){
  const res = await fetch(BACKEND_URL + (BACKEND_URL.includes('?') ? '&' : '?') + 'action=getData');
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}
async function apiPost(action, payload){
  const res = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify({action, ...payload}) });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const json = await res.json();
  if(json && json.ok === false) throw new Error(json.error || 'Request failed');
  return json;
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function currentMonthKey(){ return monthKey(todayISO()); }
function shiftMonth(mk, delta){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(mk){
  const [y,m] = mk.split('-').map(Number);
  return String(m).padStart(2,'0') + '/' + y;
}
function nameYearFromKey(mk){
  const [y,m] = mk.split('-').map(Number);
  return { name: MONTH_NAMES[m-1], year: y };
}
function keyFromNameYear(name, year){
  const idx = MONTH_NAMES.indexOf(name);
  return year + '-' + String(idx+1).padStart(2,'0');
}
function fmtINR(n){
  n = Math.round(n||0);
  return '\u20B9' + n.toLocaleString('en-IN');
}
/* ============================= GLOBAL DATE FORMATTER =============================
   Single source of truth for all date display in the app: always dd/MM/yyyy.
   Accepts: ISO strings ("yyyy-MM-dd" or full ISO datetime), Date objects, or Sheet dates. */
function formatDate(input){
  if(!input) return '\u2014';
  if(input instanceof Date){
    if(isNaN(input.getTime())) return '\u2014';
    return String(input.getDate()).padStart(2,'0') + '/' + String(input.getMonth()+1).padStart(2,'0') + '/' + input.getFullYear();
  }
  const s = String(input).slice(0,10);
  const parts = s.split('-');
  if(parts.length < 3) return '\u2014';
  const [y,m,d] = parts;
  if(!y || !m || !d) return '\u2014';
  return d.padStart(2,'0') + '/' + m.padStart(2,'0') + '/' + y;
}
const fmtDate = formatDate; // alias, all call sites use one function

/* dd/MM/yyyy (as typed/displayed) -> yyyy-MM-dd (ISO, for backend) */
function displayToISO(disp){
  if(!disp) return '';
  const parts = String(disp).trim().split('/');
  if(parts.length !== 3) return '';
  let [d,m,y] = parts;
  d = d.padStart(2,'0'); m = m.padStart(2,'0');
  if(y.length !== 4 || isNaN(+d) || isNaN(+m) || isNaN(+y)) return '';
  return y + '-' + m + '-' + d;
}
/* yyyy-MM-dd (ISO) -> dd/MM/yyyy (for the visible text field) */
function isoToDisplay(iso){
  if(!iso) return '';
  return formatDate(iso) === '\u2014' ? '' : formatDate(iso);
}
/* Auto-insert slashes as the user types digits: 13082026 -> 13/08/2026 */
function maskDateTyping(raw){
  const digits = String(raw).replace(/[^0-9]/g,'').slice(0,8);
  let out = digits.slice(0,2);
  if(digits.length >= 3) out += '/' + digits.slice(2,4);
  if(digits.length >= 5) out += '/' + digits.slice(4,8);
  return out;
}
/* Renders the custom dd/mm/yyyy text field + native picker icon used everywhere instead of <input type=date> */
function dateFieldHTML(name, isoValue, required){
  const disp = isoToDisplay(isoValue);
  return `<div class="date-field">
    <input type="text" class="date-text" name="${name}" value="${disp}" placeholder="dd/mm/yyyy" inputmode="numeric" autocomplete="off" maxlength="10" ${required?'required':''}>
    <input type="date" class="date-native" tabindex="-1" aria-hidden="true" value="${isoValue||''}">
    <svg class="date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
  </div>`;
}
function bindDateFields(scope){
  (scope||document).querySelectorAll('.date-field').forEach(field=>{
    const text = field.querySelector('.date-text');
    const native = field.querySelector('.date-native');
    if(!text || !native || text.dataset.bound) return;
    text.dataset.bound = '1';
    text.addEventListener('input', ()=>{
      text.value = maskDateTyping(text.value);
      const iso = displayToISO(text.value);
      if(iso) native.value = iso;
    });
    native.addEventListener('change', ()=>{
      text.value = isoToDisplay(native.value);
    });
  });
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ordinal(n){
  if(n===1||n===21||n===31) return 'st';
  if(n===2||n===22) return 'nd';
  if(n===3||n===23) return 'rd';
  return 'th';
}

/* ============================= LOAD DATA FROM SHEET ============================= */
async function loadFromBackend(){
  const raw = await apiGetData();
  DB.config = raw.config || DB.config;
  DB.flats = (raw.flats||[]).map(f=>({
    id: f['Flat No'],
    flatNumber: f['Flat No'],
    ownerName: f['Owner Name'] || '',
    status: (f['Status']||'Active').toLowerCase()==='vacant' ? 'vacant' : 'active',
    maintenanceAmount: Number(f['Monthly Maintenance']) || DB.config.defaultAmount,
    joiningDate: f['Joining Date'] ? String(f['Joining Date']).slice(0,10) : '',
    mobile: f['Mobile Number'] || '',
    remarks: f['Remarks'] || ''
  }));
  DB.payments = {};
  (raw.payments||[]).forEach(p=>{
    if(!p['Flat No']) return;
    const mk = keyFromNameYear(p['Month'], Number(p['Year']));
    const key = p['Flat No'] + '_' + mk;
    DB.payments[key] = {
      flatId: p['Flat No'],
      month: mk,
      status: (p['Payment Status']||'Pending').toLowerCase()==='paid' ? 'paid' : 'pending',
      amount: Number(p['Amount'])||0,
      date: p['Payment Date'] ? String(p['Payment Date']).slice(0,10) : '',
      mode: p['Payment Mode'] || '',
      remarks: p['Remarks'] || ''
    };
  });
  DB.expenses = (raw.expenses||[]).map(e=>({
    id: e['Record ID'],
    date: e['Expense Date'] ? String(e['Expense Date']).slice(0,10) : '',
    category: e['Category'] || 'Miscellaneous',
    description: e['Description'] || '',
    amount: Number(e['Amount']) || 0,
    addedBy: e['Added By'] || ''
  }));
}

/* ============================= DERIVED DATA ============================= */
function activeFlats(){ return DB.flats.filter(f=>f.status==='active'); }
function payKey(flatId, mk){ return flatId + '_' + mk; }

function paymentStatus(flatId, mk){
  const p = DB.payments[payKey(flatId, mk)];
  if(!p || p.status !== 'paid') return {label:'Pending', cls:'pending'};
  if(!p.date) return {label:'Paid On Time', cls:'paid'};
  const day = Number(p.date.slice(8,10));
  if(day <= DB.config.dueDay) return {label:'Paid On Time', cls:'paid'};
  return {label:'Late Payment', cls:'late'};
}
function totalCollected(){
  let sum = 0;
  Object.values(DB.payments).forEach(p=>{ if(p.status==='paid') sum += Number(p.amount||0); });
  return sum;
}
function totalExpensesAll(){
  return DB.expenses.reduce((s,e)=>s+Number(e.amount||0), 0);
}
function expensesForMonth(mk){
  return DB.expenses.filter(e=>e.date && monthKey(e.date)===mk);
}
function expenseSumForMonth(mk){
  return expensesForMonth(mk).reduce((s,e)=>s+Number(e.amount||0),0);
}
function collectionsForMonth(mk){
  const rows = [];
  Object.values(DB.payments).forEach(p=>{
    if(p.status==='paid' && p.month===mk){
      const flat = DB.flats.find(f=>f.id===p.flatId);
      rows.push({flat, ...p});
    }
  });
  return rows;
}

/* ============================= BOOT / RENDER ROOT ============================= */
async function boot(){
  try{
    BACKEND_URL = await getBackendUrl();
    if(!BACKEND_URL && DEFAULT_BACKEND_URL){
      BACKEND_URL = DEFAULT_BACKEND_URL;
      await setBackendUrl(DEFAULT_BACKEND_URL);
    }
    if(!BACKEND_URL){ renderGate(); return; }
    await refreshData(true);
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="loading-screen">Something went wrong starting the app:<br><br>' + escapeHtml(e.message||String(e)) + '</div>';
  }
}
async function refreshData(isBoot){
  const app = document.getElementById('app');
  if(isBoot) app.innerHTML = '<div class="loading-screen">Loading.....</div>';
  try{
    await loadFromBackend();
    SYNC_STATE = 'ok'; SYNC_ERROR='';
    LAST_REFRESH = new Date();
  }catch(e){
    SYNC_STATE = 'err'; SYNC_ERROR = e.message || String(e);
    if(isBoot){ renderConnectionError(); return; }
  }
  render();
}

  document.getElementById('app').innerHTML = `

      <div class="card stat clickable" data-open-expmonth="${lastMk}"><div class="label">Last Month Expense</div><div class="value num">${fmtINR(expenseSumForMonth(lastMk))}</div><div class="foot">${monthLabel(lastMk)} \u00B7 click for details</div></div>
      <div class="card stat clickable" data-open-expmonth="${prevMk}"><div class="label">Prev-Prev Month Expense</div><div class="value num">${fmtINR(expenseSumForMonth(prevMk))}</div><div class="foot">${monthLabel(prevMk)} \u00B7 click for details</div></div>

function monthOptions(currentMk){
  let opts = [];
  let cursor = shiftMonth(currentMk, 1);
  for(let i=0;i<15;i++){
    opts.push(cursor);
    cursor = shiftMonth(cursor,-1);
  }
  return opts.map(mk=>`<option value="${mk}" ${mk===currentMk?'selected':''}>${monthLabel(mk)}</option>`).join('');
}

function buildMonthlyExpenseSeries(){
  const mk = currentMonthKey();
  let months = [];
  let cursor = shiftMonth(mk, -11);
  for(let i=0;i<12;i++){ months.push(cursor); cursor = shiftMonth(cursor,1); }
  return { labels: months.map(m=>monthLabel(m)), data: months.map(m=>expenseSumForMonth(m)) };
}
function buildCategoryBreakdown(){
  const mk = currentMonthKey();
  const rows = expensesForMonth(mk);
  const sums = {};
  CATEGORIES.forEach(c=>sums[c]=0);
  rows.forEach(e=>{ sums[e.category] = (sums[e.category]||0) + Number(e.amount||0); });
  const labels = CATEGORIES.filter(c=>sums[c]>0);
  return { labels, data: labels.map(c=>sums[c]) };
}

let barChartInstance = null, pieChartInstance = null;
function initSummaryCharts(attempt){
  attempt = attempt || 0;
  const barEl = document.getElementById('barChart');
  const pieEl = document.getElementById('pieChart');
  if(!barEl || !pieEl) return;
  if(typeof Chart === 'undefined'){
    if(attempt < 20){ setTimeout(()=>initSummaryCharts(attempt+1), 150); return; }
    const msg = '<div class="empty">Charts could not load. Please refresh the page.</div>';
    const barWrap = barEl.closest('.chart-wrap'); if(barWrap) barWrap.innerHTML = msg;
    const pieWrap = pieEl.closest('.chart-wrap'); if(pieWrap) pieWrap.innerHTML = msg;
    return;
  }
  if(barChartInstance){ barChartInstance.destroy(); barChartInstance = null; }
  if(pieChartInstance){ pieChartInstance.destroy(); pieChartInstance = null; }

  const barCtx = barEl.getContext('2d');
  const gradient = barCtx.createLinearGradient(0,0,0,300);
  gradient.addColorStop(0, 'rgba(0,217,255,0.95)');
  gradient.addColorStop(1, 'rgba(41,121,255,0.25)');

  const {labels: barLabels, data: barData} = buildMonthlyExpenseSeries();
  barChartInstance = new Chart(barEl, {
    type:'bar',
    data:{ labels: barLabels, datasets:[{ label:'Expense', data: barData, backgroundColor: gradient, borderRadius:8, maxBarThickness:38, hoverBackgroundColor:'#00d9ff' }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:900, easing:'easeOutQuart' },
      plugins:{
        legend:{ display:false },
        tooltip:{
          backgroundColor:'#0c1830', borderColor:'rgba(0,217,255,0.35)', borderWidth:1,
          titleColor:'#e7f1ff', bodyColor:'#00d9ff', padding:10, cornerRadius:8, displayColors:false,
          callbacks:{ label:(ctx)=> '\u20B9' + Math.round(ctx.parsed.y).toLocaleString('en-IN') }
        }
      },
      scales:{
        x:{ ticks:{ color:'#7d90b8', font:{family:'IBM Plex Mono', size:11} }, grid:{ display:false } },
        y:{ ticks:{ color:'#7d90b8', font:{family:'IBM Plex Mono', size:11}, callback:(v)=>'\u20B9'+Number(v).toLocaleString('en-IN') }, grid:{ color:'rgba(255,255,255,0.06)' } }
      }
    }
  });

  const {labels: pieLabels, data: pieData} = buildCategoryBreakdown();
  const pieColors = ['#00d9ff','#2979ff','#7b61ff','#00ffab','#ffb84d','#ff5577','#f0d9ae'];
  const total = pieData.reduce((a,b)=>a+b,0);
  pieChartInstance = new Chart(pieEl, {
    type:'doughnut',
    data:{ labels: pieLabels, datasets:[{ data: pieData, backgroundColor: pieColors.slice(0,pieLabels.length), borderColor:'#0a1428', borderWidth:2, hoverOffset:12 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:900, easing:'easeOutQuart' },
      cutout:'58%',
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#e7f1ff', font:{family:'Inter', size:12}, padding:14, boxWidth:11, boxHeight:11 } },
        tooltip:{
          backgroundColor:'#0c1830', borderColor:'rgba(0,217,255,0.35)', borderWidth:1,
          titleColor:'#e7f1ff', bodyColor:'#00d9ff', padding:10, cornerRadius:8,
          callbacks:{ label:(ctx)=>{
            const pct = total ? ((ctx.parsed/total)*100).toFixed(1) : 0;
            return ' ' + ctx.label + ': \u20B9' + Math.round(ctx.parsed).toLocaleString('en-IN') + ' (' + pct + '%)';
          }}
        }
      }
    }
  });
  if(pieLabels.length === 0){
    const wrap = pieEl.closest('.chart-wrap');
    if(wrap) wrap.innerHTML = '<div class="empty">No expenses recorded this month yet.</div>';
  }
}

/* ============================= REPORTS ============================= */
function renderReports(){
  const mk = currentMonthKey();
  const tabs = [
    ['collection','Monthly Collection'],
    ['expense','Monthly Expense'],
    ['pending','Pending Payments'],
    ['flatwise','Flat-wise'],
    ['fund','Fund Statement'],
  ];
  let body = '';
  if(VIEW.reportTab==='collection'){
    const rows = collectionsForMonth(mk);
    body = reportTable(['Flat','Owner','Date','Mode','Amount'],
      rows.map(r=>[r.flat?r.flat.flatNumber:'\u2014', r.flat?r.flat.ownerName:'\u2014', fmtDate(r.date), r.mode, fmtINR(r.amount)]),
      monthLabel(mk)+' Collections');
  }
  if(VIEW.reportTab==='expense'){
    const rows = expensesForMonth(mk);
    body = reportTable(['Date','Category','Description','Amount'],
      rows.map(r=>[fmtDate(r.date), r.category, r.description, fmtINR(r.amount)]),
      monthLabel(mk)+' Expenses');
  }
  if(VIEW.reportTab==='pending'){
    const rows = activeFlats().filter(f=>paymentStatus(f.id,mk).cls==='pending');
    body = reportTable(['Flat','Owner','Amount Due'],
      rows.map(f=>[f.flatNumber, f.ownerName||'\u2014', fmtINR(f.maintenanceAmount)]),
      'Pending Payments \u2014 '+monthLabel(mk));
  }
  if(VIEW.reportTab==='flatwise'){
    const rows = DB.flats.map(f=>{
      const hist = Object.values(DB.payments).filter(p=>p.flatId===f.id && p.status==='paid');
      const total = hist.reduce((s,p)=>s+Number(p.amount||0),0);
      let pendingCount = 0;
      if(f.status==='active'){
        let cursor = mk;
        for(let i=0;i<12;i++){ if(paymentStatus(f.id,cursor).cls==='pending') pendingCount++; cursor = shiftMonth(cursor,-1); }
      }
      return [f.flatNumber, f.ownerName||'\u2014', f.status, fmtINR(total), pendingCount];
    });
    body = reportTable(['Flat','Owner','Status','Total Paid','Pending Months (12mo)'], rows, 'Flat-wise Payment Report');
  }
  if(VIEW.reportTab==='fund'){
    let entries = [];
    Object.values(DB.payments).forEach(p=>{ if(p.status==='paid') entries.push({date:p.date||'0000-00-00', type:'Collection', desc:(DB.flats.find(f=>f.id===p.flatId)||{}).flatNumber||'', amount:Number(p.amount||0)}); });
    DB.expenses.forEach(e=> entries.push({date:e.date||'0000-00-00', type:'Expense', desc:e.category+' - '+e.description, amount:-Number(e.amount||0)}));
    entries.sort((a,b)=>a.date.localeCompare(b.date));
    let bal = 0;
    const rows = entries.map(e=>{ bal += e.amount; return [fmtDate(e.date), e.type, e.desc, (e.amount<0?'-':'+')+fmtINR(Math.abs(e.amount)), fmtINR(bal)]; });
    body = reportTable(['Date','Type','Details','Amount','Running Balance'], rows, 'Fund Statement');
  }

  return `
    <div class="month-strip"><h2>Reports</h2><span class="tag">${monthLabel(mk)}</span></div>
    <div class="rep-tabs">
      ${tabs.map(([k,l])=>`<button data-report="${k}" class="${VIEW.reportTab===k?'active':''}">${l}</button>`).join('')}
    </div>
    <div id="reportArea">${body}</div>
  `;
}
function reportTable(headers, rows, title){
  return `
    <div class="card" style="padding:16px;">
      <div class="section-title" style="margin-top:0;">
        <h3>${escapeHtml(title)}</h3>
        <div style="display:flex; gap:8px;">
          <button class="btn small ghost" data-print-report="1">Export to PDF</button>
          <button class="btn small ghost" data-csv-report='${JSON.stringify({headers,rows,title}).replace(/'/g,"&apos;")}'>Export CSV</button>

      <div class="table-wrap">
        <table>
          <thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${headers.length}" class="empty">No data for this report.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ============================= HANDLERS ============================= */
function openModal(innerHtml){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick = closeModal);
}
function closeModal(){
  const o = document.getElementById('modalOverlay');
  if(o) o.remove();
}
function openPasswordModal(onSuccess){
  openModal(`
    <div class="modal-head"><h3>Settings Access</h3><button class="modal-close" data-close>&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">Enter the admin password to open Settings.</p>
      <form id="pwForm">
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="pwInput" autocomplete="off" autofocus>
        </div>
        <div id="pwError"></div>
        <div class="modal-actions">
          <button type="submit" class="btn">Unlock</button>
        </div>
      </form>
    </div>
  `);
  const input = document.getElementById('pwInput');
  if(input) input.focus();
  document.getElementById('pwForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('pwInput').value;
    if(val === SETTINGS_PASSWORD){
      unlockSettings();
      closeModal();
      onSuccess();
    }else{
      document.getElementById('pwError').innerHTML = '<div class="gate-error">Incorrect Password</div>';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  });
}
function setFormBusy(form, busy, labelBusy){
  const btn = form.querySelector('button[type=submit]');
  if(!btn) return;
  if(busy){ btn.dataset.orig = btn.textContent; btn.textContent = labelBusy || 'Saving\u2026'; btn.disabled = true; }
  else { btn.textContent = btn.dataset.orig || btn.textContent; btn.disabled = false; }
}
async function withReload(fn){
  try{ await fn(); await refreshData(false); }
  catch(e){ alert('Could not save: ' + (e.message||e)); await refreshData(false); }
}

function attachHandlers(){
  bindDateFields(document);
  document.querySelectorAll('[data-flat]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      openModal(flatDetailModal(el.getAttribute('data-flat')));
      bindFlatModalEvents();
      bindDateFields(document.getElementById('modalOverlay'));
    });
  });

  document.querySelectorAll('[data-open-expmonth]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const mk = el.getAttribute('data-open-expmonth');
      const rows = expensesForMonth(mk);
      const total = rows.reduce((s,e)=>s+Number(e.amount||0),0);
      openModal(`
        <div class="modal-head"><h3>${monthLabel(mk)} Expenses</h3><button class="modal-close" data-close>&times;</button></div>
        <div class="modal-body">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
              <tbody>
              ${rows.length ? rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${escapeHtml(r.category)}</td><td>${escapeHtml(r.description)}</td><td class="amt-cell">${fmtINR(r.amount)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No expenses recorded.</td></tr>'}
              </tbody>
              <tfoot><tr><td colspan="3" style="font-weight:700;">Total</td><td class="amt-cell" style="font-weight:700;">${fmtINR(total)}</td></tr></tfoot>
            </table>
          </div>
        </div>
      `);
    });
  });

  const fs = document.getElementById('flatSearch');
  if(fs) fs.addEventListener('input', ()=>{ VIEW.flatFilter.search = fs.value; render(); const el=document.getElementById('flatSearch'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;} });
  const fsf = document.getElementById('flatStatusFilter');
  if(fsf) fsf.addEventListener('change', ()=>{ VIEW.flatFilter.status = fsf.value; render(); });
  const addFlatBtn = document.getElementById('addFlatBtn') || document.getElementById('addFlatBtn2');
  if(addFlatBtn) addFlatBtn.addEventListener('click', ()=>{ openAddFlatModal(); });

  const addExpForm = document.getElementById('addExpenseForm');
  if(addExpForm) addExpForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(addExpForm);
    setFormBusy(addExpForm, true);
    await withReload(()=>apiPost('addExpense', { date: displayToISO(fd.get('date')), category: fd.get('category'), description: fd.get('description'), amount: Number(fd.get('amount')), addedBy:'Admin' }));
  });
  document.querySelectorAll('[data-del-expense]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Delete this expense?')) return;
      await withReload(()=>apiPost('deleteExpense', {id: b.getAttribute('data-del-expense')}));
    });
  });
  const emf = document.getElementById('expMonthFilter');
  if(emf) emf.addEventListener('change', ()=>{ VIEW.expFilter.month = emf.value==='all'?null:emf.value; render(); });
  const ecf = document.getElementById('expCategoryFilter');
  if(ecf) ecf.addEventListener('change', ()=>{ VIEW.expFilter.category = ecf.value; render(); });

  document.querySelectorAll('[data-report]').forEach(b=>{
    b.addEventListener('click', ()=>{ VIEW.reportTab = b.getAttribute('data-report'); render(); });
  });
  document.querySelectorAll('[data-print-report]').forEach(b=>{
    b.addEventListener('click', ()=> window.print());
  });
  document.querySelectorAll('[data-csv-report]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const data = JSON.parse(b.getAttribute('data-csv-report').replace(/&apos;/g,"'"));
      downloadCSV(data.title, data.headers, data.rows);
    });
  });

  const cfgForm = document.getElementById('configForm');
  if(cfgForm) cfgForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(cfgForm);
    setFormBusy(cfgForm, true);
    await withReload(()=>apiPost('updateConfig', { buildingName: fd.get('buildingName'), dueDay: Number(fd.get('dueDay')), defaultAmount: Number(fd.get('defaultAmount')), password: SETTINGS_PASSWORD }));
  });
  const reconnectBtn = document.getElementById('reconnectBtn');
  if(reconnectBtn) reconnectBtn.addEventListener('click', ()=> renderGate());
  const resyncBtn = document.getElementById('resyncBtn');
  if(resyncBtn) resyncBtn.addEventListener('click', ()=> refreshData(true));

  const efc = document.getElementById('exportFlatsCsv');
  if(efc) efc.addEventListener('click', ()=>{
    downloadCSV('flats', ['Flat Number','Owner','Status','Amount','Mobile','Joining Date','Remarks'], DB.flats.map(f=>[f.flatNumber,f.ownerName,f.status,f.maintenanceAmount,f.mobile,f.joiningDate,f.remarks]));
  });
  const epc = document.getElementById('exportPaymentsCsv');
  if(epc) epc.addEventListener('click', ()=>{
    const rows = Object.values(DB.payments).map(p=>{
      const f = DB.flats.find(x=>x.id===p.flatId) || {};
      return [f.flatNumber||'', p.month, p.status, p.date||'', p.mode||'', p.amount, p.remarks||''];
    });
    downloadCSV('payments', ['Flat','Month','Status','Date','Mode','Amount','Remarks'], rows);
  });
  const eec = document.getElementById('exportExpensesCsv');
  if(eec) eec.addEventListener('click', ()=>{
    downloadCSV('expenses', ['Date','Category','Description','Amount'], DB.expenses.map(e=>[e.date,e.category,e.description,e.amount]));
  });
}

function bindFlatModalEvents(){
  const payForm = document.getElementById('paymentForm');
  if(payForm) payForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const flatId = payForm.getAttribute('data-flat');
    const f = DB.flats.find(x=>x.id===flatId);
    const fd = new FormData(payForm);
    const mk = fd.get('month');
    const {name, year} = nameYearFromKey(mk);
    setFormBusy(payForm, true);
    closeModal();
    await withReload(()=>apiPost('addPayment', {
      month: name, year, flatNo: flatId, ownerName: f.ownerName,
      amount: Number(fd.get('amount')), date: displayToISO(fd.get('date')), mode: fd.get('mode'), remarks: fd.get('remarks')
    }));
  });
  document.querySelectorAll('[data-del-payment]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Delete this payment record?')) return;
      const {flatId, month} = JSON.parse(b.getAttribute('data-del-payment'));
      const {name, year} = nameYearFromKey(month);
      closeModal();
      await withReload(()=>apiPost('deletePayment', {flatNo:flatId, month:name, year}));
    });
  });
  const editForm = document.getElementById('editFlatForm');
  if(editForm) editForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const flatId = editForm.getAttribute('data-flat');
    const fd = new FormData(editForm);
    setFormBusy(editForm, true);
    closeModal();
    await withReload(()=>apiPost('updateFlat', {
      flatNo: flatId, ownerName: fd.get('ownerName'), status: fd.get('status'),
      monthlyMaintenance: Number(fd.get('maintenanceAmount')), mobile: fd.get('mobile'),
      joiningDate: displayToISO(fd.get('joiningDate')), remarks: fd.get('remarks')
    }));
  });
  const delBtn = document.getElementById('deleteFlatBtn');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    const flatId = editForm.getAttribute('data-flat');
    if(!confirm('Delete this flat and all its payment history? This cannot be undone.')) return;
    closeModal();
    await withReload(()=>apiPost('deleteFlat', {flatNo:flatId}));
  });
}

function openAddFlatModal(){
  openModal(`
    <div class="modal-head"><h3>Add New Flat</h3><button class="modal-close" data-close>&times;</button></div>
    <div class="modal-body">
      <form id="newFlatForm">
        <div class="form-grid">
          <div class="form-field"><label>Flat Number</label><input type="text" name="flatNo" required placeholder="e.g. Flat 12"></div>
          <div class="form-field"><label>Owner / Tenant Name</label><input type="text" name="ownerName" placeholder="Optional"></div>
          <div class="form-field"><label>Maintenance Amount</label><input type="number" name="maintenanceAmount" value="${DB.config.defaultAmount}" required></div>
          <div class="form-field"><label>Status</label>
            <select name="status"><option value="Active">Active</option><option value="Vacant">Vacant</option></select>
          </div>
          <div class="form-field"><label>Mobile Number</label><input type="tel" name="mobile" placeholder="Optional"></div>
          <div class="form-field"><label>Joining Date</label>${dateFieldHTML('joiningDate', '', false)}</div>
        </div>
        <div class="modal-actions"><button type="submit" class="btn">Add Flat</button></div>
      </form>
    </div>
  `);
  bindDateFields(document.getElementById('modalOverlay'));
  document.getElementById('newFlatForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    closeModal();
    await withReload(()=>apiPost('addFlat', {
      flatNo: fd.get('flatNo'), ownerName: fd.get('ownerName'), status: fd.get('status'),
      monthlyMaintenance: Number(fd.get('maintenanceAmount')), mobile: fd.get('mobile'), joiningDate: displayToISO(fd.get('joiningDate'))
    }));
  });
}

function downloadCSV(name, headers, rows){
  const esc = (v)=>{
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name.replace(/\s+/g,'_').toLowerCase() + '_' + todayISO() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

boot();
</script>
